short_bio_text_justify: true
short_bio: >-
  <p>
    Hi! I'm Xihan Deng (邓熙涵), an undergraduate student at
    Shanghai Jiao Tong University, majoring in Computer Science
    and Technology with a second major in Mathematics and
    Applied Mathematics. I expect to graduate in June 2027.
    My current GPA is 4.07/4.30 (93.8/100), and I was awarded
    the China National Scholarship in 2025.
  </p>

  <p>
    I am currently a visiting student at DIMACS, Rutgers
    University, working with
    <a href="https://people.cs.rutgers.edu/~kn.w/">Prof. Kangning Wang</a>.
    Since July 2025, I have also been working with
    <a href="http://www.zyhwtc.com/">Prof. Yuhao Zhang</a> and
    <a href="https://yj10027.github.io/">Prof. Yaonan Jin</a>.
  </p>

  <p>
    My research interests lie in algorithm design, algorithmic game theory, and economics and computation. I am particularly interested in understanding how strategic behavior and economic incentives shape algorithmic outcomes, and in designing algorithms and mechanisms with provable guarantees. More broadly, I hope to explore these questions in a world increasingly shaped by AI.
  </p>

  <p>
    I plan to apply to Ph.D. programs for Fall 2027 admission.
    I welcome discussions and potential collaborations related
    to my research interests.
  </p>

  <p>
    You can find my CV below.
  </p>


